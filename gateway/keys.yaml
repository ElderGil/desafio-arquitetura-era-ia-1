# Virtual keys do gateway, criadas pelo serviço gateway-init a cada subida.
#
# O valor de cada chave vem da variável de ambiente indicada em `key_env`
# (definida no .env.example). Nenhuma delas é chave de provider: a aplicação
# fala só com o gateway, e só o gateway conhece FAKE_OPENAI_KEY e FAKE_ANTHROPIC_KEY.
#
# Os valores em US$ são custo calculado com os preços do provider simulado
# (gateway/config.yaml). Nenhum provider real é chamado.

keys:
  # Chave da aplicação: teto de gasto com IA do helpdesk (docs/adr, nível corporativo)
  # e um limite de requisições folgado, só para conter um laço descontrolado.
  - alias: helpdesk-app
    key_env: HELPDESK_GATEWAY_KEY
    models: [ticket-classifier, order-extractor, reply-writer, topic-analyst]
    max_budget: 100
    budget_duration: 30d
    rpm_limit: 600

  # Chaves do roteiro de governança do README: mesma política, em escala mínima,
  # para mostrar a recusa sem consumir o orçamento da aplicação.
  - alias: roteiro-orcamento
    key_env: ROTEIRO_ORCAMENTO_KEY
    models: [ticket-classifier]
    max_budget: 0.0001

  - alias: roteiro-rpm
    key_env: ROTEIRO_RPM_KEY
    models: [ticket-classifier]
    rpm_limit: 2
